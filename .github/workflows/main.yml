name: Build Partisan Telegram Standalone APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Standalone APK Only
      run: ./gradlew :TMessagesProj:assembleAfatDebug -x test -x testDebugUnitTest -x testAfatDebugUnitTest -x :TMessagesProj_AppTests:build --continue --stacktrace || ./gradlew :TMessagesProj:assembleDebug -x test -x testDebugUnitTest -x :TMessagesProj_AppTests:build --continue --stacktrace

    - name: Copy All Build Artifacts
      run: |
        mkdir -p final_apk_output
        find . -type f \( -name "*.apk" -o -name "*.aar" -o -name "*.aab" \) -exec cp {} final_apk_output/ \;
        echo "=== ALL BUILD OUTPUT FILES ==="
        ls -la final_apk_output/

    - name: Upload Final Build
      uses: actions/upload-artifact@v4
      with:
        name: Partisan-Telegram-Build-Files
        path: final_apk_output/
        
