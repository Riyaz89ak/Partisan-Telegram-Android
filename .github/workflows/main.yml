name: Build Partisan Telegram Standalone APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --continue --stacktrace

    - name: Copy Only APK Files
      run: |
        mkdir -p final_apk_output
        find . -type f -name "*.apk" -exec cp {} final_apk_output/ \;
        echo "=== GENERATED APK FILES ==="
        ls -la final_apk_output/

    - name: Upload Final Build
      uses: actions/upload-artifact@v4
      with:
        name: Partisan-Telegram-APK-File
        path: final_apk_output/
        
