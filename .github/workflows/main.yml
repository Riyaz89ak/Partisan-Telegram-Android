name: Build Partisan Telegram APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build APK with Gradle
      run: ./gradlew :TMessagesProj:assembleRelease -x test --stacktrace

    - name: Find and Copy APK
      run: |
        mkdir -p output_apk
        find . -name "*.apk" -exec cp {} output_apk/ \;
        ls -la output_apk/

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Partisan-Telegram-APK
        path: output_apk/
        
