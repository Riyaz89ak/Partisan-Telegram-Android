name: Build Partisan Telegram APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK (Fast & No Signing Issue)
      run: ./gradlew assembleAfatDebug -x test --continue --stacktrace || ./gradlew assembleDebug -x test --continue --stacktrace

    - name: Find and Copy APK Files
      run: |
        mkdir -p final_apk_only
        find . -type f -name "*.apk" -exec cp {} final_apk_only/ \;
        echo "=== GENERATED APK FILES ==="
        ls -la final_apk_only/

    - name: Upload Final APK
      uses: actions/upload-artifact@v4
      with:
        name: Partisan-Telegram-APK
        path: final_apk_only/
