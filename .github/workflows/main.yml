name: Build Partisan Telegram Standalone APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Create Keystore for Release
      run: |
        mkdir -p ~/.android
        keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

    - name: Build Partisan Release APK
      run: ./gradlew :TMessagesProj:assembleAfatRelease -x test --continue --stacktrace || ./gradlew :TMessagesProj:assembleRelease -x test --continue --stacktrace

    - name: Copy All Build Outputs
      run: |
        mkdir -p final_artifacts
        find . -type f \( -name "*.apk" -o -name "*.aab" -o -name "*.aar" \) -exec cp {} final_artifacts/ \;
        echo "=== ALL GENERATED BUILD FILES ==="
        ls -la final_artifacts/

    - name: Upload Final Build Files
      uses: actions/upload-artifact@v4
      with:
        name: Partisan-Telegram-Build-Files
        path: final_artifacts/
        
