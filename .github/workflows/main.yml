name: Convert AAB to APK Directly

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  convert_aab:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Download Bundletool
      run: |
        wget https://github.com/google/bundletool/releases/download/1.15.6/bundletool-all-1.15.6.jar -O bundletool.jar

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build AAB File
      run: ./gradlew :TMessagesProj:bundleRelease -x test --continue

    - name: Convert AAB to APKS and Extract APK
      run: |
        mkdir -p final_apk
        # Find the generated .aab file
        AAB_FILE=$(find TMessagesProj/build/ -type f -name "*.aab" | head -n 1)
        echo "Found AAB at: $AAB_FILE"
        
        # Convert AAB to APKS using bundletool
        java -jar bundletool.jar build-apks --bundle="$AAB_FILE" --output=app.apks --mode=universal
        
        # Unzip APKS to get the universal.apk
        unzip app.apks -d extracted_apks
        
        # Copy the single installable APK
        cp extracted_apks/universal.apk final_apk/Partisan_Telegram.apk
        ls -la final_apk/

    - name: Upload Final APK
      uses: actions/upload-artifact@v4
      with:
        name: Partisan-Telegram-Direct-APK
        path: final_apk/Partisan_Telegram.apk
