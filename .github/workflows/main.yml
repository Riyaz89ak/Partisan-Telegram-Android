name: Build Partisan Telegram APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Create Debug Keystore for Release
      run: |
        mkdir -p ~/.android
        keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

    - name: Build Signed Release APK
      run: ./gradlew :TMessagesProj:assembleRelease -x test --continue --stacktrace

    - name: Find and Copy All APKs
      run: |
        mkdir -p output_apk
        find . -type f -name "*.apk" -exec cp {} output_apk/ \;
        echo "=== Found APK Files ==="
        ls -la output_apk/

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Partisan-Telegram-APK
        path: output_apk/
        if-no-files-found: error
        
