name: Build Partisan Telegram APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug AFAT APK
      run: ./gradlew :TMessagesProj:assembleAfatDebug -x test --continue --stacktrace

    - name: Inspect Build Outputs
      run: |
        mkdir -p output_apk
        echo "=== SEARCHING ALL FILES CREATED ==="
        find . -type f \( -name "*.apk" -o -name "*.aab" -o -name "*.zip" \) -exec cp {} output_apk/ \;
        echo "=== COPIED FILES ==="
        ls -la output_apk/

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Partisan-Telegram-Build
        path: output_apk/
        
